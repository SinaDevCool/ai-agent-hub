services:
  - type: web
    name: ai-agent-hub-web
    runtime: static
    buildCommand: npm install --include=dev && npm --workspace frontend run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_WS_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
  - type: web
    name: ai-agent-hub-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm --workspace backend-core run prisma:generate:postgres && npm --workspace backend-core run build
    startCommand: npm --workspace backend-core run db:migrate:postgres && npm --workspace backend-core run start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: MIGRATION_VERSION
        value: 0018_enable_rls
      - key: PORT
        value: 4141
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: FRONTEND_PUBLIC_URL
        sync: false
      - key: VAULT_LOCAL_PATH
        value: ./vault-samples/personal-vault
      - key: VAULT_ENCRYPTION_KEY
        sync: false
      - key: SYNC_MODE
        value: encrypted_cloud_backup
      - key: LOG_LEVEL
        value: info
      - key: EMBEDDING_PROVIDER
        value: local-hash
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICATION_FROM_EMAIL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
