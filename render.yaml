services:
  - type: web
    name: ai-agent-hub-web
    runtime: static
    buildCommand: npm install --include=dev && npm --workspace frontend run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_WS_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
  - type: web
    name: ai-agent-hub-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm --workspace backend-core run prisma:generate:postgres && npm --workspace backend-core run build
    startCommand: npm --workspace backend-core run db:migrate:postgres && npm --workspace backend-core run start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: MIGRATION_VERSION
        value: 0023_privacy_export_expiry
      - key: DURABLE_JOBS_ENABLED
        value: false
      - key: DURABLE_JOB_BATCH_SIZE
        value: 10
      - key: DURABLE_JOB_LEASE_MS
        value: 60000
      - key: DURABLE_JOB_POLL_MS
        value: 2000
      - key: LIVE_TRAVEL_ENABLED
        value: false
      - key: LIVE_APPOINTMENTS_ENABLED
        value: false
      - key: APPOINTMENTS_PROVIDER_TIMEOUT_MS
        value: 10000
      - key: HOSTED_TRAVEL_CHECKOUT_ENABLED
        value: false
      - key: TRAVEL_PROVIDER_TIMEOUT_MS
        value: 10000
      - key: TRAVEL_LAUNCH_REGIONS
        value: DE,EU
      - key: TRAVEL_LAUNCH_CURRENCIES
        value: EUR
      - key: TRAVEL_CHECKOUT_HOSTS
        value: ""
      - key: PRIVATE_BETA_ENFORCED
        value: false
      - key: PRIVACY_RIGHTS_ENABLED
        value: false
      - key: PRIVACY_DELETION_GRACE_HOURS
        value: 168
      - key: PRIVACY_EXPORT_EXECUTOR_ENABLED
        value: false
      - key: PRIVACY_EXPORT_PATH
        value: ./private-exports
      - key: PRIVACY_EXPORT_TTL_HOURS
        value: 24
      - key: VERTICAL_RELEASE_GATING_ENABLED
        value: false
      - key: VERTICAL_RELEASE_RULES
        value: '{}'
      - key: OPS_ALERT_DEAD_LETTER_WARN
        value: 1
      - key: OPS_ALERT_RECONCILIATION_WARN
        value: 1
      - key: OPS_ALERT_OLDEST_JOB_MINUTES
        value: 15
      - key: OPS_ALERT_PROVIDER_FAILURES_15M
        value: 5
      - key: BETA_COHORT_LIMITS
        value: '{"team":25,"trusted":5,"early":25,"expanded":100}'
      - key: BETA_CAPABILITY_RULES
        value: '{}'
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: MICROSOFT_CLIENT_ID
        sync: false
      - key: MICROSOFT_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_TENANT_ID
        value: common
      - key: MICROSOFT_REDIRECT_URI
        sync: false
      - key: PORT
        value: 4141
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      - key: FRONTEND_PUBLIC_URL
        sync: false
      - key: VAULT_LOCAL_PATH
        value: ./vault-samples/personal-vault
      - key: VAULT_ENCRYPTION_KEY
        sync: false
      - key: SYNC_MODE
        value: encrypted_cloud_backup
      - key: LOG_LEVEL
        value: info
      - key: EMBEDDING_PROVIDER
        value: local-hash
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFICATION_FROM_EMAIL
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
