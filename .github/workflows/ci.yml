name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./ci.db
      VAULT_ENCRYPTION_KEY: ci-only-encryption-key-at-least-24-characters
      FRONTEND_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --workspace backend-core run prisma:generate
      - run: npm --workspace backend-core run db:push
      - run: npm --workspace backend-core run db:seed
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:./e2e.db
      VAULT_ENCRYPTION_KEY: e2e-only-encryption-key-at-least-24-characters
      FRONTEND_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm --workspace backend-core run prisma:generate
      - run: npm --workspace backend-core run db:push
      - run: npm --workspace backend-core run db:seed:sample
      - run: npm run smoke:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
